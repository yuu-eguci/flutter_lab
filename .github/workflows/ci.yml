name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Dockerfile の中で Flutter 3.47.8 の analyze / test / web build を実行します。
      - name: docker build
        run: docker build --progress=plain -t flutter-lab .

      - name: docker run して web が配信されるか見る
        run: |
          docker run -d --rm --name flutter-lab -p 8080:80 flutter-lab
          curl --fail --silent --show-error --retry 10 --retry-all-errors http://localhost:8080/ | grep '<title>flutter_lab</title>'
          curl --fail --silent --show-error --output /dev/null http://localhost:8080/main.dart.js
          docker stop flutter-lab

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter を入れる
        run: |
          tool/install_flutter.sh "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - run: flutter build apk --debug

      # Flutter がネイティブのファイルを書き換えた (移行し忘れがある) ら失敗させます。
      - name: git の差分が無いか見る
        run: test -z "$(git status --porcelain)" || { git status --porcelain; git diff; exit 1; }

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Flutter を入れる
        run: |
          tool/install_flutter.sh "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      # 署名は行いません。署名の設定 (Team など) は変更しません。
      - run: flutter build ios --no-codesign

      # Flutter がネイティブのファイルを書き換えた (移行し忘れがある) ら失敗させます。
      - name: git の差分が無いか見る
        run: test -z "$(git status --porcelain)" || { git status --porcelain; git diff; exit 1; }
